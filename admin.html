<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ — Школьник+</title>
<style>:root{--bg:#0a0b1a;--card:#14162e;--b:#262a52;--t:#e8eaff;--m:#8d93c4;--a:#6c7bff;--p:#a855f7;--c:#22d3ee}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#3b2a8a55,transparent),var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif;padding:20px}
.card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:18px;margin-bottom:14px}.ov{overflow-x:auto}
.btn{border:0;border-radius:12px;padding:8px 14px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a),var(--p));cursor:pointer;margin:2px}.btn.g{background:transparent;border:1px solid var(--b)}.btn.on{box-shadow:0 0 14px var(--c)}.btn.r{background:#c0264b}.btn.ok{background:#16a34a}
input,select,textarea{width:100%;background:#0d0f24;border:1px solid var(--b);color:var(--t);border-radius:12px;padding:10px;font:inherit}label{display:block;margin:10px 0 4px;color:var(--m);font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}h2{margin:0 0 12px}
.toast{position:fixed;right:16px;top:16px;background:var(--card);border:1px solid var(--a);padding:10px 14px;border-radius:12px;z-index:9}img{max-width:100%;border-radius:12px;border:1px solid var(--b)}</style></head><body>
<div id="app" style="max-width:1100px;margin:auto"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),app=$('#app');
const fmt=s=>s?new Date(s.replace(' ','T')+'Z').toLocaleString('ru-RU'):'—';
const J=b=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Ошибка');return d};
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3500)};
const m=k=>k%100?(k/100).toFixed(2):String(k/100);const ST={pending:'🟡 Ожидает',approved:'🟢 Подтверждено',rejected:'🔴 Отклонено'};let tab='dep',flt='pending';
function loginView(){app.innerHTML=`<div class="card" style="max-width:380px;margin:12vh auto"><h2>🛡️ Админ-панель</h2><label>Логин администратора</label><input id="l" autocomplete="username"><label>Пароль</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><br><br><button class="btn" onclick="doLogin()">Войти</button></div>`}
async function doLogin(){try{await api('/api/admin/login',J({login:$('#l').value,password:$('#p').value}));show()}catch(e){toast(e.message)}}
async function logout(){await api('/api/admin/logout',J({}));loginView()}
async function show(){app.innerHTML=`<div class="card"><b>🛡️ Школьник+ · Админ</b> ${[['dep','💳 Пополнения'],['tx','🧾 Операции'],['log','📜 Журнал'],['set','⚙️ Реквизиты']].map(t=>`<button class="btn g ${tab==t[0]?'on':''}" onclick="tab='${t[0]}';show()">${t[1]}</button>`).join('')}<button class="btn g" onclick="logout()" style="float:right">Выйти</button></div><div id="v"></div>`;
 try{$('#v').innerHTML=await V[tab]()}catch(e){if(/вход/i.test(e.message))return loginView();toast(e.message)}}
const tbl=(h,rows)=>`<div class="card ov"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')||'<tr><td>Пусто</td></tr>'}</table></div>`;
const V={
 async dep(){const d=await api('/api/deposits'+(flt?'?status='+flt:''));
  return `<h2>${flt=='pending'?'Новые пополнения':'Пополнения'}</h2><div class="card">${[['','Все'],['pending','Ожидают проверки'],['approved','Подтверждённые'],['rejected','Отклонённые']].map(f=>`<button class="btn g ${flt==f[0]?'on':''}" onclick="flt='${f[0]}';show()">${f[1]}</button>`).join('')}</div><div id="det"></div>`+
  tbl(['ID','Пользователь','Сумма','Дата','Статус','Действия'],d.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.username)}</td><td>${m(x.amount)} грн</td><td>${fmt(x.created_at)}</td><td>${ST[x.status]}</td><td><button class="btn s" onclick="openDep(${x.id})">${x.status=='pending'?'Проверить':'Открыть'}</button></td></tr>`))},
 async tx(){const d=await api('/api/admin/transactions');return tbl(['ID','Дата','Пользователь','Тип','Сумма','Было','Стало','Ссылка'],d.map(x=>`<tr><td>${x.id}</td><td>${fmt(x.created_at)}</td><td>${esc(x.username)}</td><td>${esc(x.type)}</td><td>${x.amount>0?'+':'−'}${m(Math.abs(x.amount))}</td><td>${m(x.balance_before)}</td><td>${m(x.balance_after)}</td><td>${esc(x.reference_id)}</td></tr>`))},
 async log(){const d=await api('/api/admin/logs');return tbl(['ID','Дата','Админ','Действие','Заявка'],d.map(x=>`<tr><td>${x.id}</td><td>${fmt(x.created_at)}</td><td>${esc(x.admin_id)}</td><td>${esc(x.action)}</td><td>${x.deposit_id?'#'+x.deposit_id:''}</td></tr>`))},
 async set(){const d=await api('/api/admin/settings');return `<div class="card"><h2>Платёжные реквизиты</h2><p style="color:var(--m)">Показываются пользователям на странице пополнения.</p><textarea id="pd" rows="5">${esc(d.payment_details)}</textarea><br><br><button class="btn" onclick="saveSet()">Сохранить</button></div>`}};
async function saveSet(){try{await api('/api/admin/settings',J({payment_details:$('#pd').value}));toast('Сохранено')}catch(e){toast(e.message)}}
async function openDep(id){try{const d=await api('/api/deposits/'+id);$('#det').innerHTML=`<div class="card"><h2>Пополнение #${d.id}</h2><p>Пользователь: <b>${esc(d.username)}</b><br>Сумма: <b>${m(d.amount)} грн</b><br>Баланс пользователя: <b>${m(d.user_balance)} грн</b>${d.status=='pending'?` → ${m(d.user_balance+d.amount)} грн после зачисления`:''}<br>Дата заявки: ${fmt(d.created_at)}<br>Время перевода: ${esc(d.transfer_at)||'—'}<br>Статус: ${ST[d.status]}${d.reviewed_by?` (${esc(d.reviewed_by)}, ${fmt(d.reviewed_at)})`:''}${d.rejection_reason?`<br>Причина: ${esc(d.rejection_reason)}`:''}<br>Комментарий: ${esc(d.payment_comment)||'—'}</p>${d.has_proof?'<img src="/api/deposits/'+d.id+'/proof" alt="Подтверждение платежа">':'<p>Скриншот не приложен</p>'}${d.status=='pending'?`<br><br><button class="btn ok" onclick="appr(${d.id},'${m(d.amount)}','${esc(d.username)}','${m(d.user_balance)} → ${m(d.user_balance+d.amount)} грн')">🟢 Подтвердить</button><select id="rr" style="width:auto"><option>Не удалось подтвердить перевод</option><option>Сумма перевода не соответствует заявке</option><option value="">Другая причина…</option></select><button class="btn r" onclick="rej(${d.id})">🔴 Отклонить</button>`:''}</div>`;scrollTo(0,0)}catch(e){toast(e.message)}}
async function appr(id,a,u,x){if(!confirm(`Вы уверены, что хотите зачислить ${a} грн пользователю ${u}?\nБаланс: ${x}`))return;try{await api(`/api/admin/deposits/${id}/approve`,J({}));toast('Зачислено');show()}catch(e){toast(e.message);show()}}
async function rej(id){let r=$('#rr').value||prompt('Причина отклонения');if(!r)return;try{await api(`/api/admin/deposits/${id}/reject`,J({reason:r}));toast('Отклонено');show()}catch(e){toast(e.message);show()}}
api('/api/admin/me').then(show).catch(loginView);
</script></body></html>
