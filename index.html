<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Школьник+</title>
<style>
:root{--bg:#0a0b1a;--card:#14162e;--b:#262a52;--t:#e8eaff;--m:#8d93c4;--a:#6c7bff;--p:#a855f7;--c:#22d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#3b2a8a55,transparent),radial-gradient(700px 400px at -10% 20%,#0e4a8a44,transparent),var(--bg);color:var(--t);font:15px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none;cursor:pointer}
header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:18px;padding:12px 5%;background:#0a0b1acc;backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--c)}nav{display:flex;gap:4px;flex:1;overflow-x:auto}nav a{padding:6px 12px;border-radius:10px;color:var(--m);white-space:nowrap}nav a:hover,nav a.on{color:#fff;background:#1d2048}
.btn{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a),var(--p));cursor:pointer;box-shadow:0 0 18px #6c7bff55;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px #a855f799}
.btn.g{background:transparent;border:1px solid var(--b);box-shadow:none}.btn.s{padding:6px 12px;font-size:13px}
main{max-width:1100px;margin:auto;padding:28px 5% 110px;animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
h1{font-size:clamp(34px,6vw,60px);line-height:1.05;margin:0 0 14px}h1 span,h2 span{background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;color:transparent}h2{margin:0 0 18px;font-size:26px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:18px;transition:.25s}.card:hover{border-color:var(--a);box-shadow:0 0 24px #6c7bff33;transform:translateY(-3px)}

label{display:block;margin:12px 0 4px;color:var(--m);font-size:13px}input,select,textarea{width:100%;background:#0d0f24;border:1px solid var(--b);color:var(--t);border-radius:12px;padding:10px 12px;font:inherit}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px #22d3ee22}
.form{max-width:560px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}

.chat{display:flex;flex-direction:column;height:62vh;background:var(--card);border:1px solid var(--b);border-radius:18px;overflow:hidden}.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}

.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--b)}
.two{display:grid;grid-template-columns:240px 1fr;gap:18px}.side a{display:block;padding:9px 12px;border-radius:10px;color:var(--m)}.side a.on,.side a:hover{background:#1d2048;color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--b);text-align:left}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stats b{font-size:26px;display:block;color:var(--c)}
.toast{position:fixed;right:16px;top:70px;z-index:20;display:flex;flex-direction:column;gap:8px}.toast div{background:var(--card);border:1px solid var(--a);padding:10px 14px;border-radius:12px;animation:f .3s}
#bn{display:none;position:fixed;bottom:0;left:0;right:0;background:#0a0b1af2;border-top:1px solid var(--b);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:9}#bn a{text-align:center;font-size:11px;color:var(--m)}#bn a span{display:block;font-size:20px}
.ov{overflow-x:auto}

<header><a class="logo" onclick="go('home')">🎓 Школьник<b>+</b></a><nav id="nav"></nav><a id="hb" class="btn g s" onclick="need('balance')" style="display:none"></a><a id="bl" class="btn g s" onclick="need('notif')" style="display:none"></a><select id="lg" onchange="L=this.value;R()" style="width:auto;padding:6px 8px"><option value="ru">🇷🇺 RU</option><option value="uk">🇺🇦 UA</option><option value="en">🇬🇧 EN</option></select><div class="row hd" style="flex:none"><button id="lb" class="btn g s" onclick="go('login')">Войти</button><button id="rb" class="btn s" onclick="go('reg')">Регистрация</button><button id="lo" class="btn g s" onclick="logout()" style="display:none">Выйти</button></div></header>
<main id="app"></main><div id="bn"></div><div class="toast" id="ts"></div>
<script>

order:()=>{const SV=S.svcs||[];if(!SV.length)return '<h2>Заказать</h2><p>Услуги временно недоступны</p>';const c=SV.find(x=>x.id==S.sel)||SV[0];S.sel=c.id;return `<h2>Создать <span>заказ</span></h2><div class="form card"><label>Услуга</label><select id="osv" onchange="svcUI()">${SV.map(x=>`<option value="${x.id}" ${x.id==c.id?'selected':''}>${x.icon} ${x.name} — от ${x.tiers[0][1]} грн</option>`).join('')}</select><label>Вариант</label><select id="otr" data-s="${c.id}" onchange="svcUI()">${c.tiers.map((t,i)=>`<option value="${i}">${t[0]} — ${t[1]} грн</option>`).join('')}</select><p class="tag" id="opr" style="font-size:15px">К оплате: ${c.tiers[0][1]} грн</p><label>Название задания</label><input id="ot"><label>Описание</label><textarea id="od" rows="4" placeholder="Опишите, что нужно сделать..."></textarea><label>Предмет</label><select id="os">${opt(SUBJ)}</select><label>Срок выполнения</label><input type="date"><label>Файл или фото задания</label><input type="file" accept="image/*,.pdf,.doc,.docx"><p style="color:var(--m)">На балансе: ${mon(S.bal)} грн. Стоимость списывается с баланса при заказе.</p><button class="btn" id="obtn" onclick="pub()">Заказать — ${c.tiers[0][1]} грн</button></div>`},
ai:G(()=>{if(!S.ai_ok)return `<h2>AI <span>Помощник</span></h2><div class="card form" style="text-align:center"><div style="font-size:44px">🤖</div><h3>Доступ к AI Помощнику</h3><p>Объясняет решения по шагам и помогает подготовиться к контрольным. Разовая покупка доступа.</p><div style="font-size:36px;font-weight:800">39.99 грн</div><p>На балансе: ${mon(S.bal)} грн</p><button class="btn" onclick="buyAI()">Купить доступ</button> <button class="btn g" onclick="go('topup')">Пополнить баланс</button></div>`;return `<h2>AI <span>Помощник</span></h2><div class="chat"><div class="msgs" id="am">${S.ai.map(m=>`<div class="m ${m[0]=='me'?'me':''}">${m[1]}</div>`).join('')}</div><div class="send"><input id="ai" placeholder="Напишите свой вопрос..." onkeydown="if(event.key=='Enter')ask()"><button class="btn" style="flex:none" onclick="ask()">➤</button></div></div><div class="row" style="margin-top:10px;justify-content:flex-start">${['Помоги решить эту задачу','Объясни мне тему простыми словами','Помоги подготовиться к контрольной'].map(q=>`<button class="btn g s" style="flex:none" onclick="$('#ai').value='${q}';ask()">${q}</button>`).join('')}</div>`}),
srv:()=>`<h2><span>Услуги</span></h2><div class="grid">${(S.svcs||[]).map(x=>card(x.icon,x.name,'от '+x.tiers[0][1]+' грн',`<p style="font-size:13px">${x.tiers.map(t=>t[0]+' — '+t[1]+' грн').join('<br>')}</p><a class="btn s" onclick="S.sel='${x.id}';go('order')">Заказать</a>`)).join('')}</div>`,
faq:()=>`<h2>FAQ</h2>${[['Как создать заказ?','Откройте «Заказать», заполните форму и нажмите «Опубликовать заказ».'],['Как пополнить баланс?','Переведите сумму от 10 грн по реквизитам и отправьте заявку со скриншотом — баланс пополнится после проверки администратором.'],['Сколько стоит AI Помощник?','39.99 грн — разовая покупка доступа с баланса.'],['Как оценить исполнителя?','После выполнения заказа в «Мои заказы» появится кнопка отзыва.']].map(f=>`<details class="card" style="margin-bottom:10px"><summary><b>${f[0]}</b></summary><p>${f[1]}</p></details>`).join('')}`,

notif:G(()=>{api('/api/notifications/read',J({})).then(()=>{S.unread=0;hdr()}).catch(()=>{});return `<h2><span>Уведомления</span></h2>${S.notes.length?S.notes.map(n=>`<div class="card" style="margin-bottom:8px">${esc(n.text)}<br><small style="color:var(--m)">${fmt(n.created_at)}</small></div>`).join(''):'Уведомлений нет'}`}),
prof:()=>{if(!S.user){setTimeout(()=>go('login'));return ''}const t=S.user;return `<div class="two"><div class="side card"><div class="av" style="margin:auto">${t[0].toUpperCase()}</div><h3 style="text-align:center">${t}</h3><a class="on">📋 Мои заказы</a><a onclick="go('srv')">🛒 Мои услуги</a><a onclick="toast('Избранное: '+(S.fav.join(', ')||'пусто'))">♡ Избранное</a><a onclick="go('chat')">💬 Сообщения</a><a onclick="toast('Настройки сохранены')">⚙️ Настройки</a><a onclick="logout()">🚪 Выйти</a></div><div><a class="card" onclick="go('balance')" style="display:block;margin-bottom:6px"><h3><span>Баланс:</span> ${mon(S.bal)} грн</h3><p>История операций и пополнение →</p></a><h2 style="margin-top:20px">Мои <span>заказы</span></h2>${S.orders.map((o,i)=>`<div class="card row" style="margin-bottom:10px"><b>${o.t}</b><span>${ST[o.s]}</span>${o.s==1?`<button class="btn s" style="flex:none" onclick="S.orders[${i}].s=2;toast('🔔 Заказ выполнен');R()">Принять</button>`:''}${o.s==2?`<button class="btn g s" style="flex:none" onclick="rev()">⭐ Отзыв</button>`:''}${o.s==0?`<button class="btn g s" style="flex:none" onclick="S.orders[${i}].s=3;R()">Отменить</button>`:''}</div>`).join('')}</div></div>`},
};

function tx(s){if(L=='ru')return s;const k=s.trim(),d=D[k];return d?s.replace(k,d[L=='uk'?0:1]):s}
function tr(){const w=document.createTreeWalker(document.body,4);let n;while(n=w.nextNode()){const t=n.parentNode.tagName;if(t=='SCRIPT'||t=='STYLE')continue;if(n._o===undefined)n._o=n.nodeValue;const v=tx(n._o);if(n.nodeValue!=v)n.nodeValue=v}document.querySelectorAll('[placeholder]').forEach(e=>{if(e._p===undefined)e._p=e.placeholder;e.placeholder=tx(e._p)})}
function R(){R0();document.documentElement.lang=L;tr()}

const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Ошибка');return d};
const J=b=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=s=>s?new Date(s.replace(' ','T')+'Z').toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const B={pending:'🟡 Ожидает проверки',approved:'🟢 Пополнение подтверждено',rejected:'🔴 Отклонено'};
let seen=0;S.min=10;S.notes=[];S.unread=0;S.bal=0;
function G(f){return()=>S.user?f():(setTimeout(()=>go('login')),'')}
function need(p){S.user?go(p):(toast('Войдите в аккаунт'),go('login'))}
async function me(){try{const d=await api('/api/me');S.user=d.user;S.bal=d.balance||0;S.min=d.min||10;S.ai_ok=!!d.ai}catch{}hdr()}
function hdr(){const u=!!S.user,d=u?'':'none';$('#hb').style.display=$('#bl').style.display=$('#lo').style.display=d;$('#lb').style.display=$('#rb').style.display=u?'none':'';$('#hb').textContent='💰 Баланс: '+mon(S.bal)+' грн';$('#bl').textContent='🔔'+(S.unread?' '+S.unread:'')}
async function poll(first){if(!S.user)return;try{const n=await api('/api/notifications');S.notes=n;S.unread=n.filter(x=>!x.read).length;const m=Math.max(0,...n.map(x=>x.id));if(!first&&m>seen)n.filter(x=>x.id>seen&&!x.read).forEach(x=>toast(x.text));seen=m;const b=(await api('/api/balance')).balance;if(b!=S.bal){S.bal=b;if(/^#(balance|prof)/.test(location.hash))R()}hdr()}catch{}}
async function doAuth(r){const u=$('#au').value.trim(),p=$('#ap').value;try{if(r){if(p!=$('#ap2').value)return toast('Пароли не совпадают');await api('/api/register',J({username:u,email:$('#ae').value.trim(),password:p}))}else await api('/api/login',J({username:u,password:p}));await me();await poll(true);toast('Добро пожаловать, '+S.user+'!');go('balance')}catch(e){toast(e.message)}}
async function logout(){try{await api('/api/logout',J({}))}catch{}S.user=null;S.ai_ok=false;S.bal=0;S.unread=0;S.notes=[];hdr();go('home');R()}
async function loadBal(){try{const[d,t]=await Promise.all([api('/api/deposits'),api('/api/transactions')]);if(!$('#dl'))return;const T={deposit:'Пополнение',order_payment:'Заказ услуги',ai_access:'AI Помощник — доступ'};
$('#dl').innerHTML=d.length?`<table>${d.map(x=>`<tr><td>#${x.id}</td><td>${mon(x.amount)} грн</td><td>${fmt(x.created_at)}</td><td>${B[x.status]}${x.rejection_reason?'<br><small>'+esc(x.rejection_reason)+'</small>':''}</td></tr>`).join('')}</table>`:'Заявок пока нет';
$('#tl').innerHTML=t.length?`<table><tr><th>Дата</th><th>Операция</th><th>Сумма</th><th>Баланс</th></tr>${t.map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${x.amount>0?'🟢':'🔴'} ${T[x.type]||esc(x.type)}${x.note?' — '+esc(x.note):''} <small>#${x.id}</small></td><td>${x.amount>0?'+':'−'}${mon(Math.abs(x.amount))} грн</td><td>${mon(x.balance_after)} грн</td></tr>`).join('')}</table>`:'Операций пока нет'}catch(e){toast(e.message)}}
async function loadPD(){try{const d=await api('/api/payment-details');$('#pd')&&($('#pd').textContent=d.details||'Реквизиты пока не настроены')}catch{}}
async function sendDep(){const f=$('#tf').files[0],a=+$('#ta').value;if(!Number.isInteger(a)||a<S.min)return toast('Минимальная сумма — '+S.min+' грн');const fd=new FormData();fd.append('amount',a);fd.append('transfer_at',$('#td').value);fd.append('comment',$('#tc').value);fd.append('idem_key',S.idem);if(f)fd.append('proof',f);const b=$('#tb');b.disabled=true;try{const d=await api('/api/deposits',{method:'POST',body:fd});S.idem=uid();await poll();toast('Заявка #'+d.id+' создана и ждёт проверки');go('balance')}catch(e){toast(e.message);b.disabled=false}}
const mon=k=>k%100?(k/100).toFixed(2):String(k/100);
async function ask(){const i=$('#ai'),v=i.value.trim();if(!v)return;S.ai.push(['me',esc(v)]);i.value='';R();try{const d=await api('/api/ai/ask',J({message:v}));S.ai.push(['ai',esc(d.reply)])}catch(e){toast(e.message);if(/39/.test(e.message))S.ai_ok=false}R();setTimeout(()=>{const x=$('#am');x&&(x.scrollTop=1e9)})}
async function loadSvc(){try{S.svcs=await api('/api/services')}catch{S.svcs=[]}}
function svcUI(){const sv=S.svcs.find(x=>x.id==$('#osv').value),tr=$('#otr');S.sel=sv.id;if(tr.dataset.s!=sv.id){tr.innerHTML=sv.tiers.map((t,i)=>`<option value="${i}">${t[0]} — ${t[1]} грн</option>`).join('');tr.dataset.s=sv.id}const p=sv.tiers[+tr.value][1];$('#opr').textContent='К оплате: '+p+' грн';$('#obtn').textContent='Заказать — '+p+' грн'}
async function pub(){const t=$('#ot').value.trim();if(!t)return toast('Укажите название');if(!S.user){toast('Войдите в аккаунт');return go('login')}const sv=$('#osv').value,ti=+$('#otr').value;try{const d=await api('/api/orders',J({service:sv,tier:ti,title:t,description:$('#od').value,subject:$('#os').value}));S.orders.unshift({t,s:0,sub:$('#os').value});await me();await poll();toast('🔔 Заказ оформлен, списано '+d.price+' грн');go('prof')}catch(e){toast(e.message);if(/пополните/i.test(e.message))go('topup')}}
async function buyAI(){try{await api('/api/ai/buy',J({}));await me();await poll();toast('🟢 AI Помощник подключён!');R()}catch(e){toast(e.message);if(/пополните/i.test(e.message))go('topup')}}
addEventListener('hashchange',R);(async()=>{await Promise.all([me(),loadSvc()]);await poll(true);R();setInterval(poll,15000)})();
